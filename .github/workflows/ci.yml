name: QuishGuard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Verify Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies for OpenCV / PyPDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libsm6 libxext6
          sudo apt-get install -y --no-install-recommends libglib2.0-0t64 2>/dev/null || sudo apt-get install -y --no-install-recommends libglib2.0-0 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment and C-Extensions
        run: |
          python --version
          python -c "import cv2, zxingcpp, pypdf, PIL, reportlab; print('All core imaging and parsing C-extensions imported successfully!')"

      - name: Generate Demonstration Test Samples
        run: |
          python generate_test_samples.py

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover tests

      - name: Verify End-to-End Asset Pipeline
        run: |
          python verify_samples.py
